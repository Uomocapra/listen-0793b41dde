<style>
:root{--bg:#fafafa;--fg:#111;--mute:#8a8a8e;--chip:#ececf0;--sheet:#fff;--btn:#111;--btnfg:#fff;--line:#e3e3e8;--track:#d9d9de}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:18px/1.5 -apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}

.swipehint{font-size:13px;color:var(--mute);margin-top:6px}

.lyr::-webkit-scrollbar{display:none}

.ln{font-size:21px;line-height:1.5;margin:0 0 26px;opacity:.3;transform-origin:left top;transition:opacity .35s,transform .35s;width:78%;font-weight:500}
.ln.on{opacity:1;transform:scale(1.09);font-weight:700}
.ln.aim{opacity:.75}
.ln.head{color:var(--acc,#3f8cff)}

.aimbar{position:absolute;left:0;right:0;top:50%;height:0;opacity:0;transition:opacity .2s;pointer-events:none}

.tocb.on{background:rgba(127,127,127,.22)}
.tocb.on span{display:none}
.tocb.on svg{display:block}
.toc{position:fixed;z-index:7;left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));bottom:200px;border-radius:30px;overflow:hidden;
  background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);

.toc::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(130% 55% at 12% 0%,rgba(255,255,255,.5),transparent 58%),radial-gradient(90% 45% at 100% 100%,rgba(255,255,255,.22),transparent 62%)}

.tsec{font-size:13px;color:var(--mute);font-weight:600;margin:14px 12px 4px;letter-spacing:.06em}

.titem.on{background:rgba(255,255,255,.55);font-weight:700}

.titem:active{background:rgba(127,127,127,.22)}

.prog{width:100%;max-width:520px;margin:6px 0 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}

.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 16px}

.mode{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:0;padding:0;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center;z-index:5}

</div>

<button class="tocb" id="tocBtn" type="button" aria-label="目录" hidden><span>目录</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><h2 id="sTitle"></h2><div id="sBody"></div></div>

  if(srcIdx+1<MIRRORS.length){trySource(srcIdx+1,wantPlay,t)}
  else{allFailed=true;resumeAt=t;$('err').textContent='网络不通，声音下载不下来。网好了会自动接着放（错误码 E2'+(lastErr?'-'+lastErr:'')+'）'}}
/* every source failed (no network): try again every 10 s and as soon as the phone says it is back online */
function retryAll(){if(allFailed)trySource(0,wantPlay,resumeAt)}
setInterval(retryAll,10000);window.addEventListener('online',function(){setTimeout(retryAll,1500)});
var wantPlay=false;
A.addEventListener('loadedmetadata',function(){clearTimeout(srcTimer);$('err').textContent='';
  if(resumeAt){var t=resumeAt;resumeAt=0;try{A.currentTime=t}catch(e){}}});
/* stalled playback: "playing" but the time doesn't move. Say so after 2 s; after 7 s try the next source,
   keeping the place. In the app, also warn when the phone's media volume is at zero. */
var lastPos=-1,lastMove=Date.now(),stallMsg=false;
setInterval(function(){
  var now=Date.now(),p=A.currentTime||0;
  if(A.paused||A.ended||!A.src){lastPos=p;lastMove=now;if(stallMsg){stallMsg=false;$('err').textContent=''}return}
  if(Math.abs(p-lastPos)>0.05){lastPos=p;lastMove=now;
    if(stallMsg){stallMsg=false;$('err').textContent=''}
    if(A.vol===0){$('err').textContent='手机的媒体音量是 0，请按音量加键调大';stallMsg=true}
    return}
  var idle=now-lastMove;
  if(idle>2000&&!$('err').textContent){$('err').textContent='正在加载声音，请稍等…';stallMsg=true}
  if(idle>7000&&srcIdx+1<MIRRORS.length){lastMove=now;nextSource('卡住')}},500);
function getEnv(v){return fetchAny(v.env,'text').then(function(s){if(!s)return null;var b=atob(s.trim()),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}).catch(function(){return null})}
function getLines(v){return fetchAny(v.lines,'json').catch(function(){return[]})}
var loadSeq=0;
function commitSwitch(sg,idx){ // sg: +1 = the new ball comes from the left, -1 = from the right
  var n=ed.voices.length;if(idx==null)idx=(vi-sg+n)%n;if(idx===vi)return;
  var nbE=(B.nb&&B.nb.sg===sg)?B.nb.e:{fx:sg*0.3,fy:0,rot:0,ew:1,len:1,open:1,smile:0};
  B.oth={pal:palTo,e:{fx:B.fx.x,fy:B.fy.x,rot:B.rot.x,ew:B.ew.x,len:B.len.x,open:1,smile:0}};B.nb=null;
  ['fx','fy','rot','ew','len','smile'].forEach(function(k){B[k].x=nbE[k];B[k].v=0});B.ew.t=1;B.len.t=1;B.smile.t=0;B.next=0;
  slide=slide-sg*slotD();slideV=0;useVoice(idx,true)}

      var go=function(){if(sent>=0&&lines[sent])A.currentTime=lines[sent][0]+0.01;if(wasPlaying){B.noIntro=1;A.play().catch(function(){})}if(showLyr)follow(true)};

  navigator.mediaSession.setActionHandler('play',function(){A.play()});navigator.mediaSession.setActionHandler('pause',function(){A.pause()});
  navigator.mediaSession.setActionHandler('seekbackward',function(){A.currentTime=Math.max(0,A.currentTime-15)});

[].forEach.call(document.querySelectorAll('[data-skip]'),function(b){b.onclick=function(){var d=+b.getAttribute('data-skip');A.currentTime=Math.max(0,Math.min((A.duration||1e9)-0.2,A.currentTime+d));if(showLyr){curLn=-1;follow(true)}}});

var seeking=false,S=$('seek');

/* swipe left/right on the orb to change voice */
var sx=null,sy=0,horiz=false;
function down(x,y){if(showLyr)return;sx=x;sy=y;horiz=false}
function move(x,y,e){if(sx===null)return;var dx=x-sx,dy=y-sy;if(!horiz&&Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3)horiz=true;if(horiz){dragX=dx;if(e&&e.cancelable)e.preventDefault()}}
function up(x){if(sx===null)return;var dx=x-sx;sx=null;dragX=0;
  if(horiz&&Math.abs(dx)>W*0.2)commitSwitch(dx>0?1:-1)

var st=$('stage');
st.addEventListener('touchstart',function(e){var t=e.touches[0];down(t.clientX,t.clientY)},{passive:true});

var mdown=false;
/* look-at-finger and ripple: anywhere on the screen, touch or mouse button held */
var LK={on:false,x:0,y:0,up:-9};
function lkSet(cx0,cy0){var r=st.getBoundingClientRect();LK.x=cx0-r.left;LK.y=cy0-r.top}
function ripple(x,y){var c=(palTo&&palTo.g)||[140,140,160];
  ['a','b'].forEach(function(k){var d=document.createElement('div');d.className='rip '+k;d.style.left=x+'px';d.style.top=y+'px';d.style.borderColor='rgba('+c.join(',')+',.75)';
    d.style.background='radial-gradient(circle,rgba('+c.join(',')+',0) 45%,rgba('+c.join(',')+',.16) 100%)';document.body.appendChild(d);setTimeout(function(){d.remove()},1000)})}
document.addEventListener('pointerdown',function(e){LK.on=true;lkSet(e.clientX,e.clientY);ripple(e.clientX,e.clientY)},{passive:true});
document.addEventListener('pointermove',function(e){if(LK.on)lkSet(e.clientX,e.clientY)},{passive:true});
document.addEventListener('touchmove',function(e){if(LK.on&&e.touches[0])lkSet(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});

cv.addEventListener('mousedown',function(e){mdown=true;down(e.clientX,e.clientY)});

window.addEventListener('mouseup',function(e){if(mdown){mdown=false;up(e.clientX)}});
window.addEventListener('keydown',function(e){if(e.key==='ArrowRight')commitSwitch(-1);if(e.key==='ArrowLeft')commitSwitch(1);if(e.key===' '){e.preventDefault();$('play').onclick()}});

/* ---------- sheets ---------- */
function open(title,html,bind){tocShow(false);$('sTitle').textContent=title;$('sBody').innerHTML=html;$('mask').classList.add('on');$('sheet').classList.add('on');if(bind)bind()}
function close(){$('mask').classList.remove('on');$('sheet').classList.remove('on')}
$('mask').onclick=close;
function opts(list,sel,sw){return list.map(function(o){return '<button class="opt" type="button" data-k="'+o[0]+'" aria-checked="'+(String(o[0])===String(sel))+'">'+(sw?'<span class="sw" style="background:linear-gradient(135deg,'+rgb(pal(o[2]).a)+','+rgb(pal(o[2]).b)+','+rgb(pal(o[2]).c)+')"></span>':'')+'<span class="nm">'+esc(o[1])+'</span><span class="ck">✓</span></button>'}).join('')}
function each(fn){[].forEach.call(document.querySelectorAll('#sBody .opt'),function(b){b.onclick=function(){fn(b.getAttribute('data-k'));close()}})}
$('cVoice').onclick=function(){open('选声音（也可以左右滑动球）',opts(ed.voices.map(function(v,i){return[i,v.name,v.id]}),vi,true),function(){each(function(k){if(+k!==vi)commitSwitch(+k>vi?-1:1,+k)})})};

$('cEd').onclick=function(){open('往期',opts(data.editions.map(function(e,i){return[i,e.label]}),data.editions.indexOf(ed)),function(){each(function(k){A.pause();pick(+k)})})};

/* ---------- contents (top right) ----------
   Liquid-glass panel that grows out of the button and slides down over the ball, text and progress bar,
   stopping just above the play and ±seconds buttons, with a small gap to the screen edges (Mi 2026-11-20).
   Entries come from index.json: the opening overview, then each item's first sentence in this voice. */
var TC=$('toc'),TB=$('tocBtn'),tocOn=false;
function tocItems(){var v=ed&&V();return(v&&v.toc)||[]}
function placeToc(){var c=document.querySelector('.ctrl').getBoundingClientRect();
  TC.style.bottom=Math.max(80,innerHeight-c.top+8)+'px';
  var b=TB.getBoundingClientRect();TC.style.transformOrigin=(b.left+b.width/2-TC.offsetLeft)+'px '+(b.top+b.height/2-TC.offsetTop)+'px'}
function renderToc(){var h='',sec=null;tocItems().forEach(function(x,k){
    if(x.sec&&x.sec!==sec){sec=x.sec;h+='<div class="tsec">'+esc(sec)+'</div>'}
    h+='<button class="titem" type="button" data-k="'+k+'">'+esc(x.t)+'</button>'});
  $('tocList').innerHTML=h;markToc()}
function markToc(){var t=tocItems(),cur=lines.length?lineAt(A.currentTime):0,on=0;t.forEach(function(x,k){if(x.i<=cur)on=k});
  [].forEach.call($('tocList').querySelectorAll('.titem'),function(b){b.classList.toggle('on',+b.getAttribute('data-k')===on)})}
function tocShow(on){if(on===tocOn)return;tocOn=on;
  if(on){renderToc();placeToc();var o=$('tocList').querySelector('.titem.on');if(o)$('tocList').scrollTop=Math.max(0,o.offsetTop-80)}
  TC.classList.toggle('on',on);TB.classList.toggle('on',on);TB.setAttribute('aria-label',on?'收起目录':'目录')}
TB.onclick=function(){tocShow(!tocOn)};
$('tocList').onclick=function(e){var b=e.target.closest('.titem');if(!b)return;var x=tocItems()[+b.getAttribute('data-k')];tocShow(false);if(x)playLine(x.i)};
window.addEventListener('resize',function(){if(tocOn)placeToc()});
window.addEventListener('keydown',function(e){if(e.key==='Escape')tocShow(false)});
/* the phone's back key (the app asks first): close what is open, one thing at a time; true = handled.
   Nothing open: the app goes to the background and keeps playing. */
window.onAppBack=function(){
  if($('sheet').classList.contains('on')){close();return true}
  if(tocOn){tocShow(false);return true}
  if(showLyr){toggleLyr(false);return true}
  return false};

(function(){var r=RATES.filter(function(x){return x[0]===(prefs.rate||1)})[0];if(r)$('rName').textContent=r[1]})();
size();requestAnimationFrame(frame);
/* jsDelivr's @main can stay stale for 12 h even after a purge (2026-11-21), so publish_edition.py also tags every
   edition (1.YYYYMMDD.HHMMnn). jsDelivr's API names the newest tag within ~10 minutes, and files fetched @tag are fresh
   at once. Those hosts are asked too; if the API doesn't answer in 4 s, only the fixed hosts are used. */
/* Error codes (Mi 2026-11-23), so Mom can read one out or send a screenshot. Shown next to the version, bottom left:
   E1 no edition list from any host (also in the subtitle)   E2-<why> no host could play the audio (also in the message)
   E3 the newest tag is newer than the edition on screen (stale list)   E4 jsDelivr's tag API didn't answer (fixed hosts only) */
var lastTag=null,tagFail=false;
function diag(){var c=[],el=$('ver');if(!el)return;
  if(!data)c.push('E1');
  if(tagFail)c.push('E4');
  var m=lastTag&&String(lastTag).match(/^1\.(\d{8})\.(\d+)$/);
  if(m&&data&&data.editions&&data.editions[0]){var hm=('000000'+m[2]).slice(-6).slice(0,4),
    ts=m[1].slice(0,4)+'-'+m[1].slice(4,6)+'-'+m[1].slice(6)+'-'+hm;if(ts>data.editions[0].stem)c.push('E3')}
  el.textContent='v'+((document.querySelector('meta[name=ui-version]')||{}).content||'?')+(c.length?' · '+c.join(' '):'')}
var TAGAPI='https://data.jsdelivr.com/v1/packages/gh/Uomocapra/listen-0793b41dde/resolved?specifier=latest';
function hosts(){return new Promise(function(res){var done=false,c=window.AbortController?new AbortController():null,
  t=setTimeout(function(){if(c)c.abort();fin(null)},4000);
  function fin(v){if(done)return;done=true;clearTimeout(t);if(v)console.log('listen-tag '+v);tagFail=!v;if(v)lastTag=v;
    var H=v?['https://testingcf.jsdelivr.net/gh/Uomocapra/listen-0793b41dde@'+v+'/','https://gcore.jsdelivr.net/gh/Uomocapra/listen-0793b41dde@'+v+'/'].concat(REMOTE):REMOTE.slice();
    H.tagged=v?2:0;res(H)}
  fetch(TAGAPI+'&t='+Date.now(),{cache:'no-store',signal:c?c.signal:undefined}).then(function(r){return r.ok?r.json():null})
    .then(function(d){fin(d&&d.version)}).catch(function(){fin(null)})})}
/* In the app, ask every host for the list of editions and keep the newest ("built"): some jsDelivr nodes lag. Waits for all hosts, or 2.5 s after the first answer. */
function fetchIndex(){return hosts().then(function(H){
  return new Promise(function(res,rej){var best=null,all=[],left=H.length,over=false;
    /* keep the newest list and add the past editions the others know, newest first. The newest list's "stems" says what
       still exists: an edition dropped from the mirror but named by a stale cached list is left out. */
    function fin(){if(over)return;over=true;if(!best)return rej(new Error('no index'));
      var ok=best.stems?best.stems.join():null,seen={},eds=[];all.forEach(function(d){d.editions.forEach(function(e){
        if(!seen[e.stem]&&(!ok||ok.indexOf(e.stem)>=0)){seen[e.stem]=1;eds.push(e)}})});
      eds.sort(function(a,b){return a.stem<b.stem?1:a.stem>b.stem?-1:0});best.editions=eds.slice(0,KEEP);res(best)}
    /* v14: when the newest tag is known, the list @tag is the fresh one by definition. Wait for it (up to the 9 s
       abort) instead of finishing 2.5 s after whichever host answered first; finish as soon as it is in. */
    H.forEach(function(b,i){var c=window.AbortController?new AbortController():null;setTimeout(function(){if(c)c.abort()},9000);
      fetch(b+'data/index.json?'+Date.now(),{cache:'no-store',signal:c?c.signal:undefined}).then(function(r){return r.ok?r.json():null})
        .then(function(d){if(!d||!d.editions||!d.editions.length)return;all.push(d);
          if(!best||String(d.built)>String(best.built))best=d;
          if(i<H.tagged)setTimeout(fin,300);else if(!H.tagged&&all.length===1)setTimeout(fin,2500)})
        .catch(function(){}).then(function(){if(--left===0)fin()})})})})}
/* The app stays open in the background (back = keep running), so new editions must show up without closing it
   (Mi 2026-11-21): whenever the page comes back into view, and every 3 minutes while it is on screen, read the tiny
   data/latest.json (list of edition names) from every host; only when it differs, load the full list.
   A new newest edition is switched to at once if nothing is playing; while playing, only the 往期 list grows. */
var lastIdx=Date.now(),idxBusy=false;
function stemsOf(d){return d.editions.map(function(e){return e.stem}).join()}
function latest(){return hosts().then(function(H){return new Promise(function(res){var best=null,left=H.length;
  H.forEach(function(b){fetch(b+'data/latest.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null})
    .then(function(d){if(d&&d.stems&&(!best||String(d.built)>String(best.built)))best=d}).catch(function(){})
    .then(function(){if(--left===0)res(best)})})})})}
function refreshIndex(force){
  if(!data||idxBusy||(!force&&(document.hidden||Date.now()-lastIdx<60e3)))return;lastIdx=Date.now();idxBusy=true;
  console.log('listen-check '+(force?'return':'timer')); // shows in the app's logcat (emulator test)
  latest().then(function(l){if(l&&l.stems.slice(0,KEEP).join()===stemsOf(data))return null;return fetchIndex()})
  .then(function(d){if(!d||!d.editions||!d.editions.length||stemsOf(d)===stemsOf(data))return;
    var top=d.editions[0].stem!==data.editions[0].stem,cur=ed&&ed.stem;data=d;
    console.log('listen-refresh '+d.editions[0].stem+' n='+d.editions.length);
    if(top&&A.paused){pick(0);return}
    var k=data.editions.map(function(e){return e.stem}).indexOf(cur);if(k>=0)ed=data.editions[k]})
  .catch(function(){}).then(function(){idxBusy=false;diag()})}
document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshIndex(true)});
window.addEventListener('focus',function(){refreshIndex(true)});
window.onAppResume=function(){refreshIndex(true)}; // the app calls this in onResume (1.0.16+)
setInterval(function(){refreshIndex(false)},3*60e3);
/* first load; with no network, say so and keep trying (the app has no refresh button) */
(function first(){fetchIndex().then(function(d){data=d;pick(0);diag()}).catch(function(){
  $('sub').textContent=(NATIVE?'网络不通，网好了会自动加载':'加载失败，请检查网络后刷新')+'（错误码 E1）';diag();if(NATIVE)setTimeout(first,8000)})})();
})();
