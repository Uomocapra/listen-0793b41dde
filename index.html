<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>听新闻</title>
<style>
:root{--bg:#fafafa;--fg:#111;--mute:#8a8a8e;--chip:#ececf0;--sheet:#fff;--btn:#111;--btnfg:#fff;--line:#e3e3e8;--track:#d9d9de}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mute:#8e8e93;--chip:#1c1c1e;--sheet:#1c1c1e;--btn:#f5f5f7;--btnfg:#000;--line:#2c2c2e;--track:#3a3a3c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:18px/1.5 -apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
header{text-align:center}
#title{font-size:22px;font-weight:600;margin:4px 0 0}
#sub{font-size:15px;color:var(--mute);margin:2px 0 0}
.stage{flex:1;width:100%;position:relative;min-height:220px;touch-action:pan-y}
canvas{position:absolute;inset:0;width:100%;height:100%}
.vlabel{position:absolute;left:0;right:0;bottom:6px;text-align:center;transition:opacity .3s}
.vlabel b{display:block;font-size:20px;font-weight:600}
.dots{display:flex;gap:7px;justify-content:center;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--track);transition:all .3s}
.dots i.on{width:20px;border-radius:4px;background:var(--fg)}
.swipehint{font-size:13px;color:var(--mute);margin-top:6px}
.lyr{position:absolute;inset:0;overflow-y:auto;padding:45% 10px;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lyr::-webkit-scrollbar{display:none}
.lyr[hidden]{display:none}
.ln{font-size:21px;line-height:1.5;margin:0 0 16px;opacity:.3;transform-origin:left center;transition:opacity .35s,transform .35s;width:88%;font-weight:500}
.ln.on{opacity:1;transform:scale(1.13);font-weight:700}
.ln.aim{opacity:.75}
.ln.head{color:var(--acc,#3f8cff)}
.aimbar{position:absolute;left:0;right:0;top:50%;height:0;border-top:1px dashed var(--mute);opacity:0;transition:opacity .2s;pointer-events:none}
.aimbar.on{opacity:.5}
.prog{width:100%;max-width:520px;margin:6px 0 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--fg) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--fg);margin-top:-6.5px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--fg)}
.time{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:-2px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 16px}
.round{width:50px;height:50px;border-radius:50%;border:0;background:var(--chip);color:var(--fg);font:600 15px/1 inherit;display:flex;align-items:center;justify-content:center;flex-direction:column}
.round small{font-size:11px;color:var(--mute);margin-top:2px;font-weight:500}
#play{width:80px;height:80px;border-radius:50%;border:0;background:var(--btn);color:var(--btnfg);display:flex;align-items:center;justify-content:center}
#play svg{width:32px;height:32px;fill:currentColor}
.chips{display:flex;gap:8px;justify-content:center;max-width:520px}
.chip{border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:15px;padding:9px 13px;border-radius:999px;white-space:nowrap}
.chip b{font-weight:600}
.mode{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:0;padding:0;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center;z-index:5}
.mode svg{width:24px;height:24px}
.mode canvas{width:46px;height:46px;border-radius:50%}
.mode [hidden]{display:none}
.err{color:#ff453a;font-size:15px;min-height:0;text-align:center}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:17px;color:var(--mute);font-weight:600;margin:0 0 6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--fg);font:inherit;font-size:20px;padding:15px 4px;border-bottom:1px solid var(--line);text-align:left}
.opt:last-child{border-bottom:0}
.opt .sw{width:22px;height:22px;border-radius:50%;flex:none}
.opt .nm{flex:1}
.opt .ck{opacity:0}
.opt[aria-checked=true] .ck{opacity:1}
</style>
</head>
<body>
<div class="app">
  <button class="mode" id="mode" type="button" aria-label="看文字"><svg id="mText" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 10.5h12M4 15h16M4 19.5h9"/></svg><canvas id="mini" hidden></canvas></button>
  <header>
    <div id="title">听新闻</div>
    <div id="sub">加载中…</div>
  </header>
  <div class="stage" id="stage">
    <canvas id="orb"></canvas>
    <div class="vlabel" id="vlabel"><b id="vBig">—</b><div class="dots" id="dots"></div></div>
    <div class="lyr" id="lyr" hidden></div>
    <div class="aimbar" id="aim"></div>
  </div>
  <div class="prog">
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="进度">
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="err" id="err"></div>
  <div class="ctrl">
    <button class="round" data-skip="-15" type="button" aria-label="倒退15秒">−15<small>秒</small></button>
    <button class="round" data-skip="-5" type="button" aria-label="倒退5秒">−5<small>秒</small></button>
    <button id="play" type="button" aria-label="播放"><svg viewBox="0 0 24 24" id="ico"><path d="M8 5.5v13l11-6.5z"/></svg></button>
    <button class="round" data-skip="5" type="button" aria-label="快进5秒">+5<small>秒</small></button>
    <button class="round" data-skip="15" type="button" aria-label="快进15秒">+15<small>秒</small></button>
  </div>
  <div class="chips">
    <button class="chip" id="cVoice" type="button">声音</button>
    <button class="chip" id="cRate" type="button">语速 <b id="rName">正常</b></button>
    <button class="chip" id="cEd" type="button">往期</button>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><h2 id="sTitle"></h2><div id="sBody"></div></div>

<audio id="a" preload="auto"></audio>
<script>
(function(){
var $=function(i){return document.getElementById(i)},A=$('a');
var data=null,ed=null,vi=0,env=null,KEY='fn.prefs';
var prefs=(function(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(prefs))}catch(e){}}
function fmt(s){if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
var RATES=[[0.85,'慢一点'],[1,'正常'],[1.2,'快一点']];

/* One orb per voice. Female voices: warm tones; male voices: cool tones.
   [light, mid, deep, glow rgb, cloud1, cloud2, cloud3] */
var PAL={
  'xiaoxiao':     ['#ffe1ea','#ff8fb1','#e8487d','255,120,160','rgba(255,255,255,.75)','rgba(255,190,210,.8)','rgba(230,60,120,.6)'],
  'xiaoxiao-slow':['#efe4ff','#c4a2ff','#8a5cf0','180,140,255','rgba(255,255,255,.7)','rgba(220,200,255,.8)','rgba(130,80,230,.6)'],
  'xiaoyi':       ['#fff0dc','#ffb37a','#ff7a45','255,160,100','rgba(255,255,255,.75)','rgba(255,215,170,.8)','rgba(250,110,60,.6)'],
  'yunyang':      ['#d6e6ff','#4f8dff','#1a3fbf','80,140,255','rgba(255,255,255,.65)','rgba(140,190,255,.8)','rgba(20,60,200,.65)'],
  'yunxi':        ['#d5fbf4','#3fd0c0','#0b8a95','60,200,190','rgba(255,255,255,.65)','rgba(150,240,225,.8)','rgba(0,120,140,.6)'],
  'yunjian':      ['#dfe3f0','#7d8cb5','#2c3a66','120,140,190','rgba(255,255,255,.55)','rgba(170,185,225,.8)','rgba(30,45,100,.7)']};
var FALL=PAL['yunyang'];
function hex(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
function pal(id){var p=PAL[id]||FALL;return{a:hex(p[0]),b:hex(p[1]),c:hex(p[2]),g:p[3].split(',').map(Number),cl:[p[4],p[5],p[6]]}}
function mix(x,y,k){return x.map(function(v,i){return Math.round(v+(y[i]-v)*k)})}
function rgb(c,a){return a==null?'rgb('+c.join(',')+')':'rgba('+c.join(',')+','+a+')'}
var palNow=null,palFrom=null,palTo=null,palK=1;

/* ---------- orb ---------- */
var cv=$('orb'),cx=cv.getContext('2d'),W=0,H=0,DPR=1,lvl=0,t0=performance.now(),dragX=0,slide=0,slideV=0,lastFrameT=0,pendingAudio=null;
function size(){DPR=Math.min(2,window.devicePixelRatio||1);var r=$('stage').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR}
window.addEventListener('resize',size);
function target(){if(A.paused||!env)return 0;var i=Math.floor(A.currentTime*25),v=0;for(var k=-1;k<=1;k++){var j=i+k;if(j>=0&&j<env.length)v=Math.max(v,env[j])}return v/255}
function curPal(){
  if(palK<1){palK=Math.min(1,palK+0.06)}
  var f=palFrom||palTo,k=palK;
  return{a:mix(f.a,palTo.a,k),b:mix(f.b,palTo.b,k),c:mix(f.c,palTo.c,k),g:mix(f.g,palTo.g,k),cl:k<.5?f.cl:palTo.cl}}
function frame(now){
  requestAnimationFrame(frame);
  if(showLyr){if(!aiming)follow();if(palTo)drawMini(now/1000);return}
  if(!palTo)return;
  var t=(now-t0)/1000,tg=target(),P=curPal();
  lvl+=(tg-lvl)*(tg>lvl?0.35:0.12);
  var fdt=Math.min(0.05,t-(lastFrameT||t));lastFrameT=t;
  if(isDragging()){slide=dragX;slideV=0}
  else{for(var q=0;q<4;q++){slideV+=(-2*0.92*9*slideV-81*slide)*fdt/4;slide+=slideV*fdt/4}
    if(Math.abs(slide)<0.5&&Math.abs(slideV)<2){slide=0;slideV=0;if(B.oth){B.oth=null}if(pendingAudio){var pa=pendingAudio;pendingAudio=null;pa()}}}
  var idle=A.paused?0.5+0.5*Math.sin(t*1.6):0;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
  bot(t,P,lvl,slide)}

/* ---------- Grok-Bot-style avatar ----------
   One flat colored ball, two solid white pill eyes, no mouth (Mi 2026-11-20, after studying x.ai's avatar motion demo).
   Ball size follows the voice. Not playing: lively - eyes glance around, blink, smile with ∩ eyes, little hops.
   Playing = "working" (Mi 2026-11-20): reads left to right, suddenly drops the head and looks down, slowly turns
   right to left with the head down, then suddenly looks up to the upper right at 45 degrees, and repeats.
   Eyes are plain pills (same width top and bottom); no spin, no colored trails. */
// working loop keyframes: face position fx/fy (fy>0 = looking down), eye length (shorter = head lowered), tilt, move time, hold
var WK=[{fx:-.32,fy:.06,len:1,rot:0,mv:1.0,hold:.5},{fx:.32,fy:.06,len:1,rot:0,mv:2.8,hold:.5},
  {fx:.3,fy:.36,len:.74,rot:0,mv:.3,hold:.8},{fx:-.32,fy:.36,len:.74,rot:0,mv:3.2,hold:.8},
  {fx:.34,fy:-.34,len:1,rot:6,mv:.35,hold:1.4}];
function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}
function spring(x){return{x:x,v:0,t:x}}
function step(s,w,z,dt){s.v+=(-2*z*w*s.v-w*w*(s.x-s.t))*dt;s.x+=s.v*dt}
var B={fx:spring(0),fy:spring(0),rot:spring(0),open:spring(1),len:spring(1),smile:spring(0),hop:spring(0),
  squash:spring(1),pop:spring(0),jig:spring(0),ew:spring(1),landN:0,wiggle:-9,wake:-9,daze:null,nextDaze:6,next:0,nextBlink:1.5,blinkAt:-9,smileUntil:0,nextSmile:3,nextHop:2,last:0,wk:null};
function rnd(a,b){return a+Math.random()*(b-a)}
function bot(t,P,lv,sl){
  var dt=Math.min(0.05,t-(B.last||t));B.last=t;
  var work=!A.paused;
  // each press of play: smile, nod twice, then start working (Mi 2026-11-20)
  if(B.introReq){B.introReq=0;B.intro={t0:t};B.wk=null}
  var intro=(B.intro&&work)?t-B.intro.t0:-1;if(intro>2.2||!work){B.intro=null;intro=-1}
  // --- choose targets ---
  if(t>B.next){
    if(!work){B.fx.t=rnd(-.42,.42);B.fy.t=rnd(-.38,.2);B.rot.t=rnd(-8,8);B.len.t=1;B.next=t+rnd(.9,2.8)}}
  B.hop.t=0;
  if(intro>=0){var nod=(intro>1&&intro<2.1)?Math.pow(Math.sin((intro-1)/0.55*Math.PI),2):0;
    B.fx.t=0;B.rot.t=0;B.len.t=1-0.3*nod;B.fy.t=0.02+0.4*nod;B.hop.t=0.35*nod}
  else if(work){ // follow the reading loop
    if(!B.wk){B.wk={i:0,t0:t,from:{fx:B.fx.x,fy:B.fy.x,len:B.len.x,rot:B.rot.x}}}
    var k=WK[B.wk.i],e=ease(Math.min(1,(t-B.wk.t0)/k.mv)),f0=B.wk.from;
    B.fx.t=f0.fx+(k.fx-f0.fx)*e;B.fy.t=f0.fy+(k.fy-f0.fy)*e;B.len.t=f0.len+(k.len-f0.len)*e;B.rot.t=f0.rot+(k.rot-f0.rot)*e;
    if(t-B.wk.t0>k.mv+k.hold){B.wk={i:(B.wk.i+1)%WK.length,t0:t,from:{fx:k.fx,fy:k.fy,len:k.len,rot:k.rot}}}}
  else B.wk=null;
  // daze (idle): eyes go flat (height a bit less than width), eyes flatten slowly over 3 s, then drift very slowly for 5 s (Mi 2026-11-20), then the ball pops bigger and smiles
  if(work||intro>=0){B.daze=null;B.nextDaze=t+rnd(8,13)}
  else if(!B.daze&&t>(B.nextDaze||6)&&t>B.smileUntil+1){B.daze={t0:t,dur:8,x0:rnd(-.2,.2),y0:rnd(-.08,.12),dir:Math.random()<.5?-1:1};B.rot.t=0}
  if(B.daze){var dz=B.daze,fl0=Math.min(1,(t-dz.t0)/3);fl0=fl0*fl0*(3-2*fl0);
    // eyes circle around; the speed starts fast and slows down while the eyes flatten, until it matches the slow daze drift
    dz.ph=(dz.ph||0)+dt*(Math.PI*2/5+(Math.PI*2/1.1-Math.PI*2/5)*(1-fl0));var ph=dz.ph;
    B.fx.t=dz.x0+dz.dir*0.1*Math.sin(ph);B.fy.t=dz.y0+0.06*(1-Math.cos(ph));
    var fl=Math.min(1,(t-dz.t0)/3);fl=fl*fl*(3-2*fl); // eyes go from long to short slowly over ~3 s, then stay flat ~5 s
    B.next=t+1;B.nextBlink=t+1;B.nextHop=t+2;B.len.t=1-(1-0.32)*fl;
    if(t-B.daze.t0>B.daze.dur){B.daze=null;B.wake=t;B.landN=0;B.pop.v+=3.2;B.smileUntil=t+0.3+rnd(2.5,3.5);B.nextSmile=B.smileUntil+rnd(4,7);B.nextDaze=t+rnd(9,15)}}
  // waking from the daze (Mi 2026-11-20): eyes snap open big for a moment, like being startled, then quickly turn into a smile
  var wk=t-(B.wake||-9),startled=wk>=0&&wk<0.3;
  if(startled){B.len.t=1.3;B.ew.t=1.35;B.next=t+1;B.nextBlink=t+1}else if(wk<0.5){B.len.t=1;B.ew.t=1}
  if(t>B.nextBlink){B.blinkAt=t;B.nextBlink=t+(work?rnd(2.5,5):rnd(1.4,3.6))}
  var bk=t-B.blinkAt;B.open.t=bk<.09?0.08:1;
  if(!work&&!B.daze&&t>B.nextSmile){B.smileUntil=t+rnd(2.8,4.5);B.nextSmile=B.smileUntil+rnd(3,6)}
  B.smile.t=intro>=0?(intro<1?1:0):((!work&&!B.daze&&!startled&&t<B.smileUntil)?1:0);
  if(!work&&t>B.nextHop){B.hop.v-=rnd(2.2,3.2);B.squash.v+=rnd(2,3);B.nextHop=t+rnd(2.5,5.5)}
  var panic=isDragging();
  if(panic){ // finger on the ball: drop everything at once (smile, daze, hops), eyes pop big, shrink back, then frantic left-right glances
    if(B.panicT0==null){B.panicT0=t;B.smile.x=0;B.smile.v=0;B.daze=null;B.wake=-9;B.landN=2;B.wiggle=-9;B.intro=null;B.hop.x=0;B.hop.v=0;
      B.ew.x=1.45;B.ew.v=0;B.len.x=1.35;B.len.v=0;B.open.x=1}
    var pt=t-B.panicT0;B.smile.t=0;B.next=t+0.5;B.nextBlink=t+0.6;B.nextDaze=t+8;
    if(pt<0.18){B.ew.t=1.45;B.len.t=1.35;B.fx.t=B.fx.x}else if(pt<0.36){B.ew.t=0.95;B.len.t=0.9;B.fx.t=0;B.fy.t=0;B.pnext=t}
    else if(otherSeen(sl)){B.ew.t=1.15;B.len.t=1.05;B.fx.t=-Math.sign(sl)*0.45;B.fy.t=0;B.rot.t=0}
    else{B.ew.t=1.25;B.len.t=1.1;if(t>(B.pnext||0)){B.fx.t=rnd(-.42,.42);B.fy.t=rnd(-.36,.3);B.rot.t=rnd(-10,10);B.pnext=t+rnd(.17,.48)}}}
  else if(B.oth&&otherSeen(sl)){B.fx.t=-Math.sign(sl)*0.4;B.fy.t=0;B.rot.t=0;B.next=t+0.6}
  else{B.panicT0=null;if(B.ew.t>1.2&&!startled){B.ew.t=1;B.len.t=1}}
  // --- springs ---
  var sub=4,h=dt/sub;for(var i=0;i<sub;i++){
    step(B.fx,panic?26:(work?11:6),panic?.55:(work?.85:.5),h);step(B.fy,intro>=0?22:(panic?26:(work?11:6)),panic?.55:(work?.85:.5),h);step(B.rot,8,.6,h);
    step(B.open,40,.7,h);step(B.len,startled?40:10,startled?.5:.8,h);step(B.smile,(intro>=0||wk<1.2)?14:4.5,1,h);step(B.ew,30,.55,h);step(B.hop,16,.35,h);step(B.pop,13,.35,h);step(B.jig,24,.16,h);step(B.squash,18,.3,h)}
  B.squash.t=1;
  // --- geometry ---
  var R0=Math.min(W,H-70)*0.33,R=R0*(0.94+0.18*lv)*(1+0.18*B.pop.x);
  // after waking from a daze: smiling, it hops twice (crouch, stretch in the air, squash and shudder on landing),
  // then gives a happy little wiggle (Mi 2026-11-20)
  var jy=0,jsx=1,jsy=1;
  for(var j=0;j<2;j++){var st=0.55+j*0.55,tau=(wk-st)/0.42;
    if(tau>-0.3&&tau<0){var cr=(tau+0.3)/0.3;cr=Math.sin(cr*Math.PI/2);jsx*=1+0.1*cr;jsy*=1-0.13*cr}
    else if(tau>=0&&tau<1){jy=-4*0.34*tau*(1-tau);var air=Math.sin(tau*Math.PI);jsx*=1-0.07*air;jsy*=1+0.1*air}
    if(tau>=1&&(B.landN||0)<=j&&wk<3){B.landN=j+1;B.jig.v+=9;if(j===1)B.wiggle=t}}
  var wg=t-(B.wiggle||-9),wig=wg>=0&&wg<1.6?0.16*Math.sin(wg*17)*Math.exp(-wg*3.2):0;
  var X=W/2+sl,Y=(H-70)/2+8+B.hop.x*R*0.12+jy*R;

  // --- carousel: the other ball sits one slot away (the neighbor while dragging, the old one after a switch) ---
  var cur={fx:B.fx.x,fy:B.fy.x,rot:B.rot.x,ew:B.ew.x,len:B.len.x,open:B.open.x,smile:B.smile.x};
  if(Math.abs(sl)>1){var sg=Math.sign(sl),oX=W/2+sl-sg*slotD(),o;
    if(B.oth)o=B.oth;else{if(!B.nb||B.nb.sg!==sg)B.nb={sg:sg,pal:pal(ed.voices[(vi-sg+ed.voices.length)%ed.voices.length].id),e:{fx:sg*0.2,fy:0,rot:0,ew:1,len:1,open:1,smile:0}};o=B.nb}
    var oe=o.e,k8=0.18;oe.fx+=(sg*0.45-oe.fx)*k8;oe.fy+=(0-oe.fy)*k8;oe.rot*=0.9;oe.smile*=0.85;oe.open=1;

function slotD(){return W*0.9}
function otherSeen(sl){if(Math.abs(sl)<1)return false;var R0=Math.min(W,H-70)*0.33;return Math.abs(sl-Math.sign(sl)*slotD())<W/2+R0*0.85}

function drawBall(X,Y,R,sx,sy,wig,P,lv,e){

  for(var s=-1;s<=1;s+=2){
    var u=e.fx+s*0.235, q=pos(u,R), ex=q.x, ey=q.y+e.fy*R*0.55-R*0.06, fore=q.f;
    if(fore<=0.02)continue;

// a point on the front of the sphere: u in [-1.3,1.3] (0 = center) -> x offset and horizontal foreshortening

/* ---------- lyrics ---------- */
var lines=[],curLn=-1,showLyr=false,aiming=false,aimTimer=0,L=$('lyr');
function lineAt(t){var i=0;while(i+1<lines.length&&lines[i+1][0]<=t+0.05)i++;return i}

var autoUntil=0;
function center(el,smooth){autoUntil=Date.now()+(smooth?900:150);L.scrollTo({top:el.offsetTop-L.clientHeight/2+el.offsetHeight/2,behavior:smooth?'smooth':'auto'})}

  if(!lines.length)return;var i=lineAt(A.currentTime);
  if(i===curLn&&!force)return;
  [].forEach.call(L.querySelectorAll('.ln.on'),function(o){o.classList.remove('on')});
  curLn=i;var el=L.children[i];if(!el)return;el.classList.add('on');center(el,!force)}
function centerLine(){var mid=L.scrollTop+L.clientHeight/2,best=0,bd=1e9;[].forEach.call(L.children,function(el,i){var d=Math.abs(el.offsetTop+el.offsetHeight/2-mid);if(d<bd){bd=d;best=i}});return best}
var lastAim=-1;

function userScrolling(){aiming=true;$('aim').classList.add('on');markAim();clearTimeout(aimTimer);
  aimTimer=setTimeout(function(){ // finger lifted and scroll settled: play the sentence in the middle
    if(touching){userScrolling();return}
    var i=centerLine();$('aim').classList.remove('on');var o=L.children[lastAim];if(o)o.classList.remove('aim');lastAim=-1;
    if(lines[i]){A.currentTime=lines[i][0]+0.01;if(A.paused)A.play().catch(function(){})}
    aiming=false;curLn=-1;follow(true)},700)}
// any scroll we did not start ourselves is the user browsing the text
var touching=false;
L.addEventListener('touchstart',function(){touching=true;autoUntil=0},{passive:true});

L.addEventListener('wheel',function(){autoUntil=0},{passive:true});
L.addEventListener('scroll',function(){if(touching||aiming||Date.now()>autoUntil)userScrolling()},{passive:true});
L.onclick=function(e){var d=e.target.closest('.ln');if(!d){toggleLyr(false);return}e.stopPropagation();clearTimeout(aimTimer);aiming=false;$('aim').classList.remove('on');A.currentTime=lines[+d.getAttribute('data-i')][0]+0.01;if(A.paused)A.play().catch(function(){});follow(true)};
/* top-left button: in ball view it shows a text icon; in text view it shows a tiny ball doing the Grok Bot idle (glances, blinks) */
var MC=$('mini'),mcx=MC.getContext('2d'),M={fx:0,fy:0,tx:0,ty:0,next:0,blink:-9,nextBlink:1};
function drawMini(t){
  var d=Math.min(2,window.devicePixelRatio||1),S=46;if(MC.width!==S*d){MC.width=MC.height=S*d}

  var keep=cx;cx=mcx;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,S,S);

$('mode').onclick=function(){toggleLyr(!showLyr)};
function toggleLyr(on){showLyr=on;$('mText').style.display=on?'none':'';MC.hidden=!on;$('mode').setAttribute('aria-label',on?'看球':'看文字');L.hidden=!on;cv.style.visibility=on?'hidden':'visible';$('vlabel').style.opacity=on?0:1;$('vlabel').style.pointerEvents=on?'none':'';if(on){curLn=-1;follow(true)}}

/* ---------- player ---------- */
function V(){return ed.voices[vi]}

  ['fx','fy','rot','ew','len','smile'].forEach(function(k){B[k].x=nbE[k];B[k].v=0});B.ew.t=1;B.len.t=1;B.smile.t=0;B.next=0;
  slide=slide-sg*slotD();slideV=0;useVoice(idx,true)}
