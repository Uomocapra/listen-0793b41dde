<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>听新闻</title>
<style>
:root{--bg:#fafafa;--fg:#111;--mute:#8a8a8e;--chip:#ececf0;--sheet:#fff;--btn:#111;--btnfg:#fff;--line:#e3e3e8}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mute:#8e8e93;--chip:#1c1c1e;--sheet:#1c1c1e;--btn:#f5f5f7;--btnfg:#000;--line:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:18px/1.5 -apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
header{text-align:center}
#title{font-size:22px;font-weight:600;margin:4px 0 0}
#sub{font-size:15px;color:var(--mute);margin:2px 0 0}
.stage{flex:1;width:100%;position:relative;min-height:240px}
canvas{position:absolute;inset:0;width:100%;height:100%}
.time{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums;height:22px;margin:-6px 0 14px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:34px;margin-bottom:22px}
.round{width:58px;height:58px;border-radius:50%;border:0;background:var(--chip);color:var(--fg);font:600 15px/1 inherit;display:flex;align-items:center;justify-content:center;flex-direction:column}
.round small{font-size:11px;color:var(--mute);margin-top:2px;font-weight:500}
#play{width:84px;height:84px;border-radius:50%;border:0;background:var(--btn);color:var(--btnfg);display:flex;align-items:center;justify-content:center}
#play svg{width:34px;height:34px;fill:currentColor}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:520px}
.chip{border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:15px;padding:9px 13px;border-radius:999px;white-space:nowrap}
.chip b{font-weight:600}
.err{color:#ff453a;font-size:15px;min-height:20px;margin:-8px 0 8px;text-align:center}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:17px;color:var(--mute);font-weight:600;margin:0 0 6px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:var(--fg);font:inherit;font-size:20px;padding:16px 4px;border-bottom:1px solid var(--line);text-align:left}
.opt:last-child{border-bottom:0}
.opt .ck{opacity:0;font-size:20px}
.opt[aria-checked=true] .ck{opacity:1}
.text{user-select:text}
.text p{margin:0 0 .9em;font-size:19px;line-height:1.7}
.text h3{font-size:20px;margin:1.1em 0 .3em}
</style>
</head>
<body>
<div class="app">
  <header>
    <div id="title">听新闻</div>
    <div id="sub">加载中…</div>
  </header>
  <div class="stage" id="stage"><canvas id="orb"></canvas></div>
  <div class="time" id="time">0:00 / 0:00</div>
  <div class="err" id="err"></div>
  <div class="ctrl">
    <button class="round" id="back" type="button" aria-label="倒退15秒">−15<small>秒</small></button>
    <button id="play" type="button" aria-label="播放"><svg viewBox="0 0 24 24" id="ico"><path d="M8 5.5v13l11-6.5z"/></svg></button>
    <button class="round" id="fwd" type="button" aria-label="快进15秒">+15<small>秒</small></button>
  </div>
  <div class="chips">
    <button class="chip" id="cVoice" type="button">声音 <b id="vName">—</b></button>
    <button class="chip" id="cRate" type="button">语速 <b id="rName">正常</b></button>
    <button class="chip" id="cEd" type="button">往期</button>
    <button class="chip" id="cText" type="button">文字</button>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><h2 id="sTitle"></h2><div id="sBody"></div></div>

<audio id="a" preload="auto"></audio>
<script>
(function(){
var $=function(i){return document.getElementById(i)},A=$('a');
var data=null,ed=null,voice=null,env=null,KEY='fn.prefs';
var prefs=(function(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(prefs))}catch(e){}}
function fmt(s){if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
var RATES=[[0.85,'慢一点'],[1,'正常'],[1.2,'快一点']];

/* ---------- orb ---------- */
var cv=$('orb'),cx=cv.getContext('2d'),W=0,H=0,DPR=1,lvl=0,t0=performance.now();
function size(){DPR=Math.min(2,window.devicePixelRatio||1);var r=$('stage').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR}
window.addEventListener('resize',size);
function target(){
  if(A.paused||!env)return 0;
  var i=Math.floor(A.currentTime*25);
  var v=0;for(var k=-1;k<=1;k++){var j=i+k;if(j>=0&&j<env.length)v=Math.max(v,env[j])}
  return v/255}
function frame(now){
  var t=(now-t0)/1000,tg=target();
  lvl+= (tg-lvl)*(tg>lvl?0.35:0.12);
  var idle=A.paused?0.5+0.5*Math.sin(t*1.6):0;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
  var R0=Math.min(W,H)*0.30,R=R0*(0.90+0.04*idle+0.30*lvl),X=W/2,Y=H/2;
  // soft glow
  var g=cx.createRadialGradient(X,Y,R*0.6,X,Y,R*1.55);
  g.addColorStop(0,'rgba(80,150,255,'+(0.18+0.25*lvl)+')');g.addColorStop(1,'rgba(80,150,255,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,R*1.6,0,7);cx.fill();
  // wobbling body
  cx.save();cx.beginPath();
  var N=96;for(var n=0;n<=N;n++){var a=n/N*Math.PI*2;
    var w=1+(0.012+0.05*lvl)*Math.sin(3*a+t*1.7)+(0.008+0.035*lvl)*Math.sin(5*a-t*2.3)+0.02*lvl*Math.sin(7*a+t*3.1);
    var px=X+Math.cos(a)*R*w,py=Y+Math.sin(a)*R*w;n?cx.lineTo(px,py):cx.moveTo(px,py)}
  cx.closePath();cx.clip();
  var b=cx.createLinearGradient(X-R,Y-R,X+R,Y+R);b.addColorStop(0,'#cfe6ff');b.addColorStop(0.5,'#5aa2ff');b.addColorStop(1,'#1d4fff');
  cx.fillStyle=b;cx.fillRect(X-R*1.2,Y-R*1.2,R*2.4,R*2.4);
  // moving clouds inside
  var blobs=[[0.55,1.0,'rgba(255,255,255,0.75)'],[0.45,-1.3,'rgba(140,210,255,0.8)'],[0.5,0.7,'rgba(40,90,255,0.65)'],[0.38,-0.6,'rgba(255,255,255,0.5)']];
  blobs.forEach(function(p,i){var ang=t*p[1]*(0.35+0.6*lvl)+i*1.7,d=R*(0.35+0.1*Math.sin(t*0.9+i));
    var bx=X+Math.cos(ang)*d,by=Y+Math.sin(ang*1.3)*d,br=R*p[0]*(1+0.25*lvl);
    var rg=cx.createRadialGradient(bx,by,0,bx,by,br);rg.addColorStop(0,p[2]);rg.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle=rg;cx.beginPath();cx.arc(bx,by,br,0,7);cx.fill()});
  // top highlight
  var h=cx.createRadialGradient(X-R*0.35,Y-R*0.45,0,X-R*0.35,Y-R*0.45,R*0.9);
  h.addColorStop(0,'rgba(255,255,255,0.55)');h.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=h;cx.fillRect(X-R*1.2,Y-R*1.2,R*2.4,R*2.4);
  cx.restore();
  requestAnimationFrame(frame)}

/* ---------- player ---------- */
function setIcon(){$('ico').innerHTML=A.paused?'<path d="M8 5.5v13l11-6.5z"/>':'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';$('play').setAttribute('aria-label',A.paused?'播放':'暂停')}
function cur(){return ed.voices.filter(function(x){return x.id===voice})[0]}
function loadEnv(v){env=null;fetch(v.env).then(function(r){return r.ok?r.text():''}).then(function(s){if(!s)return;var b=atob(s.trim()),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);env=u}).catch(function(){})}
function setSrc(autoplay){
  var v=cur();if(!v)return;$('err').textContent='';
  A.src=v.url;A.load();A.playbackRate=prefs.rate||1;loadEnv(v);
  $('vName').textContent=v.name.split(' ')[0];
  if(autoplay)A.play().catch(function(){});
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:ed.title+' · '+ed.sub.split('　')[0],artist:'听新闻 · '+v.name});
    navigator.mediaSession.setActionHandler('play',function(){A.play()});navigator.mediaSession.setActionHandler('pause',function(){A.pause()});
    navigator.mediaSession.setActionHandler('seekbackward',function(){A.currentTime=Math.max(0,A.currentTime-15)});
    navigator.mediaSession.setActionHandler('seekforward',function(){A.currentTime=Math.min(A.duration||1e9,A.currentTime+15)})}catch(e){}}}
function pick(i){
  ed=data.editions[i];$('title').textContent=ed.title;$('sub').textContent=ed.sub;
  var ids=ed.voices.map(function(v){return v.id});
  voice=ids.indexOf(prefs.voice)>=0?prefs.voice:ids[0];setSrc(false)}

$('play').onclick=function(){if(A.paused)A.play().catch(function(){$('err').textContent='播不出来，请检查网络后再点一次'});else A.pause()};
$('stage').onclick=$('play').onclick;
$('back').onclick=function(){A.currentTime=Math.max(0,A.currentTime-15)};
$('fwd').onclick=function(){A.currentTime=Math.min(A.duration||1e9,A.currentTime+15)};
A.onplay=A.onpause=A.onended=setIcon;
A.onerror=function(){if(A.src)$('err').textContent='加载失败，请检查网络，或换个声音再试'};
A.ontimeupdate=A.onloadedmetadata=function(){$('time').textContent=fmt(A.currentTime)+' / '+fmt(A.duration)};

/* ---------- sheets ---------- */
function open(title,html,bind){$('sTitle').textContent=title;$('sBody').innerHTML=html;$('mask').classList.add('on');$('sheet').classList.add('on');if(bind)bind()}
function close(){$('mask').classList.remove('on');$('sheet').classList.remove('on')}
$('mask').onclick=close;
function opts(list,sel){return list.map(function(o){return '<button class="opt" type="button" data-k="'+o[0]+'" aria-checked="'+(String(o[0])===String(sel))+'"><span>'+esc(o[1])+'</span><span class="ck">✓</span></button>'}).join('')}
function each(fn){[].forEach.call(document.querySelectorAll('#sBody .opt'),function(b){b.onclick=function(){fn(b.getAttribute('data-k'));close()}})}
$('cVoice').onclick=function(){open('选声音（换了从头播）',opts(ed.voices.map(function(v){return[v.id,v.name]}),voice),function(){each(function(k){var was=!A.paused;voice=k;prefs.voice=k;save();setSrc(was)})})};
$('cRate').onclick=function(){open('语速',opts(RATES,prefs.rate||1),function(){each(function(k){prefs.rate=+k;save();A.playbackRate=+k;$('rName').textContent=RATES.filter(function(r){return r[0]==k})[0][1]})})};
$('cEd').onclick=function(){open('往期',opts(data.editions.map(function(e,i){return[i,e.label]}),data.editions.indexOf(ed)),function(){each(function(k){A.pause();pick(+k)})})};
$('cText').onclick=function(){var h='';(ed.text||'').split('\n').forEach(function(l){l=l.trim();if(!l||/^(先听要点|下面是详细内容)/.test(l))return;var hd=/。$/.test(l)&&l.length<30&&l.indexOf('，')<0;h+=(hd?'<h3>':'<p>')+esc(l)+(hd?'</h3>':'</p>')});open(ed.title+' · 文字',' <div class="text">'+h+'</div>')};

(function(){var r=RATES.filter(function(x){return x[0]===(prefs.rate||1)})[0];if(r)$('rName').textContent=r[1]})();
size();requestAnimationFrame(frame);
fetch('data/index.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){data=d;pick(0)}).catch(function(){$('sub').textContent='加载失败，请检查网络后刷新'});
})();
</script>
</body>
</html>
